<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07552b" />
    <title>Property Listings Admin | Crystal Garden</title>
    <link rel="stylesheet" href="/properties.css" />
    <script src="/property-admin.js" defer></script>
  </head>
  <body class="admin-page">
    <header class="market-header admin-header">
      <a class="market-brand" href="/properties.html" aria-label="Crystal Garden Estate land for sale">
        <img class="market-logo" src="https://crystalgardenestate.com/wp-content/uploads/2024/09/cge-removebg-preview-154x43.png" alt="Crystal Garden Estate" />
        <span class="market-brand-tagline">Low Cost, Bigger Value</span>
      </a>
      <nav class="market-nav" aria-label="Admin navigation">
        <a href="/properties.html">View marketplace</a>
        <a href="/">Realtor Portal</a>
      </nav>
    </header>
    <main class="admin-main">
      <span class="market-eyebrow">Marketplace administration</span>
      <h1>Review land listings</h1>
      <p>Review realtor-submitted land before publishing. Official website listings are shown for reference and are managed from their source.</p>

      <form id="adminCredentialForm" class="admin-credential">
        <label>Admin name<input name="adminName" autocomplete="username" required /></label>
        <label>Password<input name="adminPassword" type="password" autocomplete="current-password" required /></label>
        <button class="search-button" type="submit">Load listings</button>
      </form>

      <p id="adminStatus" class="admin-status" role="status" aria-live="polite"></p>
      <section id="adminTools" hidden>
        <form id="adminPropertyForm" class="property-form">
          <h3>Publish land for sale</h3>
          <div class="form-grid">
            <label class="form-span"><span>Land listing title</span><input name="title" required maxlength="120" placeholder="e.g. Residential plot for sale in Lekki" /></label>
            <input name="listingType" type="hidden" value="sale" />
            <input name="propertyType" type="hidden" value="land" />
            <label><span>Price (₦)</span><input name="price" type="number" min="1" step="1000" required /></label>
            <label><span>Land area (m²)</span><input name="areaSqm" type="number" min="1" step="1" required /></label>
            <label class="form-span"><span>Street address or neighbourhood</span><input name="address" required maxlength="200" /></label>
            <label><span>City</span><input name="city" required maxlength="80" /></label>
            <label><span>State or territory</span><input name="state" required maxlength="80" /></label>
            <label class="form-span"><span>Land details</span><textarea name="description" rows="3" maxlength="3000" placeholder="Add land use, title documents, survey, access, and other relevant details"></textarea></label>
            <label class="form-span"><span>Photo URLs (one HTTPS URL per line, up to 10)</span><textarea name="imageUrls" rows="3" required></textarea></label>
            <label><span>Agent name</span><input name="agentName" required maxlength="120" /></label>
            <label><span>Agent phone</span><input name="agentPhone" type="tel" maxlength="40" required /></label>
            <label class="form-span"><span>Agent email</span><input name="agentEmail" type="email" maxlength="160" /></label>
          </div>
          <button class="search-button form-submit" type="submit">Publish listing</button>
        </form>

        <h2 class="admin-list-heading">All listings</h2>
        <div id="adminListingCount" class="admin-status"></div>
        <div id="adminListingGrid" class="admin-list"></div>
      </section>
    </main>
  </body>
</html>
